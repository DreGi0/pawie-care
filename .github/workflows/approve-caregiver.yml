name: Approve demo caregiver

# Runs `caregivers:approve` against the demo database (RN-CUI-03), for whoever tries the
# sign-up with their documents. Manual: Actions > Approve demo caregiver > Run workflow.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Email of the caregiver account to approve
        required: true
        type: string

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @pawie/api generate

      # The API validates its whole environment even for this script. Redis and S3 are
      # never used by it, so they carry placeholders; the database is the direct Neon URL.
      - name: Approve the caregiver
        run: pnpm --filter @pawie/api caregivers:approve "$CAREGIVER_EMAIL"
        env:
          CAREGIVER_EMAIL: ${{ inputs.email }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: placeholder-this-script-never-signs-a-token
          S3_ENDPOINT: http://localhost:8333
          S3_BUCKET: placeholder
          S3_ACCESS_KEY_ID: placeholder
          S3_SECRET_ACCESS_KEY: placeholder
