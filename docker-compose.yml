# Local development infrastructure. Start with `pnpm infra:up`.
name: pawie-care

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pawie
      POSTGRES_PASSWORD: pawie
      POSTGRES_DB: pawie
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory of /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawie -d pawie']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for pet photos and vet instructions (docs/arquitectura.md §3.5).
  # `weed mini` runs every SeaweedFS component in one container and, from these
  # variables, creates the access key and the bucket.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: pawie
      AWS_SECRET_ACCESS_KEY: pawie-local-secret
      S3_BUCKET: pawie-files
    ports:
      - '8333:8333' # S3 API
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI: http://localhost:8025

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
