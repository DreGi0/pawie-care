# Local development infrastructure. Start with `pnpm infra:up`.
name: pawie-care

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pawie
      POSTGRES_PASSWORD: pawie
      POSTGRES_DB: pawie
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory of /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawie -d pawie']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI: http://localhost:8025

volumes:
  postgres-data:
  redis-data:
