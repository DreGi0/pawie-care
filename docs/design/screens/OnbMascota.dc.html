<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Onboarding: tu mascota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6b3a8a}a:hover{color:#4f2a66}
button,input{font-family:inherit}
input::placeholder{color:#6b6274}
input:focus{outline:3px solid #6b3a8a;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #fff8f0; color: #3b3346; font-family: Nunito, 'SF Pro Rounded', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px 32px">

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6b6274">Paso 1 de 2</span>
<div role="progressbar" aria-label="Progreso" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1" style="height: 8px; border-radius: 999px; background: #eadfd3; overflow: hidden"><div style="width: 50%; height: 100%; border-radius: 999px; background: #6b3a8a"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800">Cuéntanos de tu mascota</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #6b6274">Así te mostramos cuidadores que pueden atenderla.</p>
</div>

<button style="align-self: center; width: 112px; height: 112px; border-radius: 999px; border: 2px dashed #958879; background: #e7d6f2; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #3b3346">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b3346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">Agregar foto</span>
</button>

<form style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="nombre" style="font-size: 15px; line-height: 20px; font-weight: 700">Nombre</label>
<input id="nombre" value="Luna" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; background: #ffffff; border: 1.5px solid #958879; border-radius: 12px; font-size: 16px; color: #3b3346">
</div>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-size: 15px; line-height: 20px; font-weight: 700">Es un</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{species}}" as="o" hint-placeholder-count="2">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 52px; border: none; border-radius: 999px; cursor: pointer; font-size: 15px; line-height: 20px; font-weight: 700; color: #3b3346; background: {{o.bg}}; box-shadow: {{o.ring}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0 0 8px; font-size: 15px; line-height: 20px; font-weight: 700">Sexo</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sexes}}" as="o" hint-placeholder-count="2">
<button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="height: 52px; border: none; border-radius: 999px; cursor: pointer; font-size: 15px; line-height: 20px; font-weight: 700; color: #3b3346; background: {{o.bg}}; box-shadow: {{o.ring}}">{{o.label}}</button>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="nac" style="font-size: 15px; line-height: 20px; font-weight: 700">Fecha de nacimiento</label>
<input id="nac" inputmode="numeric" placeholder="DD/MM/AAAA" value="12/03/2023" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; background: #ffffff; border: 1.5px solid #958879; border-radius: 12px; font-size: 16px; color: #3b3346">
<label style="display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 16px; line-height: 24px; cursor: pointer">
<input type="checkbox" checked style="width: 24px; height: 24px; margin: 0; accent-color: #6b3a8a">
No sé la fecha exacta, es aproximada</label>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="raza" style="font-size: 15px; line-height: 20px; font-weight: 700">Raza <span style="font-weight: 600; color: #6b6274">(opcional)</span></label>
<input id="raza" placeholder="Ej.: zaguate, labrador" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; background: #ffffff; border: 1.5px solid #958879; border-radius: 12px; font-size: 16px; color: #3b3346">
</div>
</form>

<div style="display: flex; gap: 12px; padding: 16px; background: #cfe6f7; border-radius: 20px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b3346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 16px; line-height: 24px">¿Toma medicina o se recupera de una operación? Agrégalo luego en su perfil y te mostramos cuidadores ⭐.</p>
</div>

<a href="OnbDireccion.dc.html" style="margin-top: auto; height: 52px; border-radius: 999px; background: #6b3a8a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none">Continuar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const opt = (list, key, cur) => list.map(([id, label]) => ({
label,
pressed: id === cur ? 'true' : 'false',
bg: id === cur ? '#e7d6f2' : '#ffffff',
ring: id === cur ? 'inset 0 0 0 2px #6b3a8a' : '0 6px 20px rgba(59, 51, 70, 0.08)',
pick: () => this.setState({ [key]: id })
}));
return {
species: opt([['dog', 'Perro'], ['cat', 'Gato']], 'species', s.species || 'dog'),
sexes: opt([['FEMALE', 'Hembra'], ['MALE', 'Macho']], 'sex', s.sex || 'FEMALE')
};
}
}
</script>
</body>
</html>
