<!doctype html>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#6b3a8a}a:hover{color:#4f2a66}
input,select{font-family:inherit}
input::placeholder{color:#6b6274}
input:focus,select:focus{outline:3px solid #6b3a8a;outline-offset:1px}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #fff8f0; color: #3b3346; font-family: Nunito, 'SF Pro Rounded', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px; padding: 24px 16px 32px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="OnbMascota.dc.html" aria-label="Volver al paso 1" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px; background: #ffffff; box-shadow: 0 6px 20px rgba(59, 51, 70, 0.08); display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b3346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<span style="font-size: 13px; line-height: 18px; font-weight: 600; color: #6b6274">Paso 2 de 2</span>
<div role="progressbar" aria-label="Progreso" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2" style="height: 8px; border-radius: 999px; background: #6b3a8a"></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 800">¿Dónde vive Luna?</h1>
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #6b6274">Es donde tu cuidador hará las visitas.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="distrito" style="font-size: 15px; line-height: 20px; font-weight: 700">Distrito</label>
<select id="distrito" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; background: #ffffff; border: 1.5px solid #958879; border-radius: 12px; font-size: 16px; color: #3b3346">
<option>San Salvador</option>
<option>Antiguo Cuscatlán</option>
<option>Santa Tecla</option>
<option>Mejicanos</option>
<option>Soyapango</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="calle" style="font-size: 15px; line-height: 20px; font-weight: 700">Dirección</label>
<input id="calle" autocomplete="street-address" placeholder="Colonia, calle y número de casa" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; background: #ffffff; border: 1.5px solid #958879; border-radius: 12px; font-size: 16px; color: #3b3346">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="detalles" style="font-size: 15px; line-height: 20px; font-weight: 700">Referencias <span style="font-weight: 600; color: #6b6274">(opcional)</span></label>
<input id="detalles" placeholder="Ej.: portón negro, frente al parque" style="height: 52px; box-sizing: border-box; width: 100%; padding: 0 16px; background: #ffffff; border: 1.5px solid #958879; border-radius: 12px; font-size: 16px; color: #3b3346">
</div>
</form>

<div style="display: flex; gap: 12px; padding: 16px; background: #d6e6cc; border-radius: 20px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b3346" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<p style="margin: 0; font-size: 16px; line-height: 24px">Tu cuidador ve esta dirección solo cuando la visita está confirmada y pagada.</p>
</div>

<a href="Main.dc.html" style="margin-top: auto; height: 52px; border-radius: 999px; background: #6b3a8a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none">Buscar cuidadores</a>
</div>
</x-dc>
